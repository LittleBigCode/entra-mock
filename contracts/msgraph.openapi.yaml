openapi: 3.1.0
info:
  title: Microsoft Graph mock (Entra groups)
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /{tenant}/oauth2/v2.0/token:
    post:
      summary: Token
      description: Flux client credentials — le vrai chemin d'authentification de
        Graph.
      operationId: token__tenant__oauth2_v2_0_token_post
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          title: Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/groups:
    get:
      summary: Groupes
      operationId: groupes_v1_0_groups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1.0/groups/{group_id}/members:
    get:
      summary: Membres
      description: 'Membres d''un groupe, paginés par curseur opaque — comme Graph.


        Le curseur est ici l''index de départ encodé dans `@odata.nextLink`. Un

        pipeline qui ne suivrait pas ce lien ne verrait que les PAGE_SIZE premiers

        membres, sans la moindre erreur. C''est pourquoi la page est petite.'
      operationId: membres_v1_0_groups__group_id__members_get
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
